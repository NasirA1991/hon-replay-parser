name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: cargo test --release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bin: honreplay }
          - { os: macos-latest, target: aarch64-apple-darwin, bin: honreplay }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: honreplay.exe }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} honreplay-${{ matrix.target }}${{ endsWith(matrix.bin, '.exe') && '.exe' || '' }}
      - uses: softprops/action-gh-release@v2
        with:
          files: honreplay-${{ matrix.target }}*
